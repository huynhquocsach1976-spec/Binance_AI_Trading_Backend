name: Paper Trading BTC (lenh gia)

on:
  schedule:
    - cron: "10 0 * * *"      # chạy mỗi ngày lúc 00:10 UTC (07:10 giờ Việt Nam)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run paper trader
        run: python paper_trader.py

      - name: Commit paper trading results
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          git add paper_trading
          git diff --cached --quiet || git commit -m "Paper trading update $(date -u +%F)"
          git pull --rebase origin main || true
          git push
