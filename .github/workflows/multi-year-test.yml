name: Multi-Year Walk-Forward Test

on:
  workflow_dispatch:

jobs:
  multi-year:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download 4 years of data (BTC, ETH, SOL)
        run: python download_binance_vision.py

      - name: Run multi-year walk-forward
        run: python walk_forward_multi.py | tee multi_year_result.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: multi-year-result
          path: multi_year_result.txt
