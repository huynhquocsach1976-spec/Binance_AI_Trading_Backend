name: Run Walk-Forward Test

on:
  workflow_dispatch:

jobs:
  walk-forward:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Check data file
        run: |
          ls -lh historical/
          python -c "import pandas as pd; df=pd.read_csv('historical/XBTUSD_60.csv'); print('Candles:', len(df))"

      - name: Run walk-forward test
        run: |
          python walk_forward.py | tee walk_forward_result.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-result
          path: walk_forward_result.txt
